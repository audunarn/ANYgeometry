name: Panel pressure projection
# Branches are tested through their pull request; push runs only on main (owner, 2026-11-25: reduce CI load).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Superseded pull-request runs are cancelled.  A re-run attempt and every other run (main pushes, tags, schedules,
# dispatches) gets a group of its own, so it is never cancelled or replaced by a newer run.
concurrency:
  group: panel-pressure-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

jobs:
  pressure-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,planar,sketch]"
      - run: python -m pytest -q tests/test_panel_pressure_projection.py tests/test_floating_overlap.py
