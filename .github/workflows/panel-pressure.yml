name: Panel pressure projection
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pressure-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,planar,sketch]"
      - run: python -m pytest -q tests/test_panel_pressure_projection.py tests/test_floating_overlap.py
