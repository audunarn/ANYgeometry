name: Closed solid region contracts

on:
  pull_request:
    paths: ['src/anygeometry/**', 'tests/test_solid_regions.py', '.github/workflows/solid-regions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,planar]"
      - run: python -m pytest -q tests/test_solid_regions.py tests/test_features_editing.py tests/test_serialization.py --junitxml=solid-regions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solid-regions-${{ matrix.os }}-${{ matrix.python }}
          path: solid-regions.xml
