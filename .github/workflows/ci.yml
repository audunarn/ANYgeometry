name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify the requested Mac architecture
        if: runner.os == 'macOS'
        env:
          MAC_LABEL: ${{ matrix.os }}
        run: >-
          python -c "import os, platform; expected = 'x86_64' if os.environ['MAC_LABEL'] == 'macos-15-intel' else 'arm64'; assert platform.machine() == expected, (platform.machine(), expected)"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,planar]"
      - name: Run tests
        run: |
          python tools/check_licenses.py --check-installed
          python -m pytest
      - name: Verify package import and CLI version
        run: |
          python -c "import anygeometry; assert anygeometry.__version__ == '0.4.4'"
          python -m anygeometry --version

  planar-absence:
    name: pytest (planar backend absent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Create isolated environment without the planar extra
        env:
          ABSENCE_VENV: ${{ runner.temp }}/anygeometry-planar-absence
        run: |
          python -m venv --copies "$ABSENCE_VENV"
          "$ABSENCE_VENV/bin/python" -m pip install --upgrade pip
          "$ABSENCE_VENV/bin/python" -m pip install -e ".[dev]"
          "$ABSENCE_VENV/bin/python" tools/check_licenses.py
      - name: Verify the typed missing-capability contract
        env:
          ABSENCE_VENV: ${{ runner.temp }}/anygeometry-planar-absence
        run: |
          "$ABSENCE_VENV/bin/python" - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("shapely") is None
          PY
          "$ABSENCE_VENV/bin/python" -m pytest tests/test_intersection_workflow.py::test_planar_backend_absence_is_typed_capability_missing

  wheel:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        id: contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,planar]"
          python tools/check_licenses.py --check-installed
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          init_text = Path("src/anygeometry/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          assert match is not None and match.group(1) == version, (match, version)
          with open(Path(__import__("os").environ["GITHUB_OUTPUT"]), "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY
          python -m build
          python -m twine check dist/*
      - name: Require one wheel and one source distribution
        env:
          PACKAGE_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert wheels[0].name == f"anygeometry-{version}-py3-none-any.whl", wheels[0]
          assert sdists[0].name == f"anygeometry-{version}.tar.gz", sdists[0]

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "anygeometry/py.typed" in names
              metadata_name, = [name for name in names if name.endswith(".dist-info/METADATA")]
              wheel_metadata = email.message_from_bytes(archive.read(metadata_name))
              assert wheel_metadata["Name"] == "ANYgeometry"
              assert wheel_metadata["Version"] == version
              assert wheel_metadata["License-Expression"] == "MPL-2.0"
              license_root = metadata_name.rsplit("/", 1)[0] + "/licenses/"
              expected_licenses = {
                  license_root + relative
                  for relative in (
                      "LICENSE",
                      "NOTICE",
                      "THIRD_PARTY_NOTICES.md",
                      "dependency-licenses.json",
                      "docs/LICENSE.md",
                  )
              }
              assert expected_licenses <= set(names), (expected_licenses - set(names))

          with tarfile.open(sdists[0], "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              root = f"anygeometry-{version}"
              assert f"{root}/src/anygeometry/py.typed" in members
              for relative in (
                  "LICENSE",
                  "NOTICE",
                  "THIRD_PARTY_NOTICES.md",
                  "dependency-licenses.json",
                  "docs/LICENSE.md",
              ):
                  assert f"{root}/{relative}" in members, relative
              package_info = archive.extractfile(members[f"{root}/PKG-INFO"])
              assert package_info is not None
              sdist_metadata = email.message_from_binary_file(package_info)
              assert sdist_metadata["Name"] == "ANYgeometry"
              assert sdist_metadata["Version"] == version
              assert sdist_metadata["License-Expression"] == "MPL-2.0"
          PY
      - name: Retain the single candidate build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anygeometry-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  minimum-dependencies:
    name: Minimum dependencies (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,planar]' 'numpy==1.26.0' 'shapely==2.0.0'
      - run: python -m pytest

  wheel-smoke:
    name: Installed wheel (${{ matrix.os }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: anygeometry-candidate
          path: candidate
      - name: Verify the artifact in isolated base and planar environments
        run: >-
          python tools/check_compatibility.py wheel
          --candidate candidate/*.whl
          --expected-machine "${{ matrix.os == 'macos-15-intel' && 'x86_64' || matrix.os == 'macos-15' && 'arm64' || '' }}"
          --output "$RUNNER_TEMP/geometry-wheel-smoke"
      - name: Preserve complete smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-smoke-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/geometry-wheel-smoke/report.json
            ${{ runner.temp }}/geometry-wheel-smoke/command-*.log
            ${{ runner.temp }}/geometry-wheel-smoke/without-planar/*.json
            ${{ runner.temp }}/geometry-wheel-smoke/with-planar/*.json

  consumers:
    name: Installed public consumers (${{ matrix.os }}, ${{ matrix.profile }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: public
          - os: ubuntu-latest
            profile: public
          - os: macos-15
            profile: mesher
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: anygeometry-candidate
          path: candidate
      - name: Compare installed candidate and released geometry
        run: >-
          python tools/check_compatibility.py consumers
          --candidate candidate/*.whl
          --profile ${{ matrix.profile }}
          --expected-machine "${{ matrix.os == 'macos-15' && 'arm64' || '' }}"
          --output "$RUNNER_TEMP/geometry-consumers"
      - name: Preserve complete consumer comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumers-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/geometry-consumers/report.json
            ${{ runner.temp }}/geometry-consumers/command-*.log
            ${{ runner.temp }}/geometry-consumers/candidate/*.json
            ${{ runner.temp }}/geometry-consumers/baseline/*.json

  mcp-consumers:
    name: Installed MCP consumer (${{ matrix.os }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require explicitly scoped access to the private adapter
        env:
          HAS_MCP_ACCESS: ${{ secrets.ANYGEOMETRY_MCP_READ_TOKEN != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          if os.environ['HAS_MCP_ACCESS'] != 'true':
              root = Path(os.environ['RUNNER_TEMP']) / 'geometry-mcp'
              root.mkdir()
              report = {'status': 'blocked', 'reason': 'ANYGEOMETRY_MCP_READ_TOKEN is not configured; Contents: read access to audunarn/ANYgeometry-mcp is required.'}
              (root / 'report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
              print('::error::' + report['reason'])
              raise SystemExit(1)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYgeometry-mcp
          ref: 4253c001b07263fa2e9015082cf4950db65cd2d3
          path: .ecosystem/ANYgeometry-mcp
          token: ${{ secrets.ANYGEOMETRY_MCP_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: anygeometry-candidate
          path: candidate
      - run: python -m pip install 'setuptools>=77.0.3' wheel
      - name: Compare installed MCP consumers
        run: >-
          python tools/check_compatibility.py consumers
          --candidate candidate/*.whl
          --mcp-source .ecosystem/ANYgeometry-mcp
          --profile mcp
          --expected-machine "${{ matrix.os == 'macos-15' && 'arm64' || '' }}"
          --output "$RUNNER_TEMP/geometry-mcp"
      - name: Record setup failures without losing the access diagnosis
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'geometry-mcp'
          if not (root / 'report.json').exists():
              root.mkdir(exist_ok=True)
              (root / 'report.json').write_text(json.dumps({'status': 'failed', 'reason': 'Adapter checkout or job setup failed before the probe; see job logs.'}), encoding='utf-8')
          PY
      - name: Preserve MCP comparison or blocked-prerequisite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-consumers-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/geometry-mcp/report.json
            ${{ runner.temp }}/geometry-mcp/command-*.log
            ${{ runner.temp }}/geometry-mcp/candidate/*.json
            ${{ runner.temp }}/geometry-mcp/baseline/*.json
