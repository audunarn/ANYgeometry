name: DIAGNOSTIC ONLY native-domain Mac reproduction
run-name: DIAGNOSTIC ONLY native-domain Mac (${{ github.ref_name }})
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  EPOCH_RUNTIME_EVIDENCE: epoch-runtime.json
  CURVED_RUNTIME_EVIDENCE: curved-runtime.json
  NATIVE_SCOPE_RUNTIME_EVIDENCE: native-runtime.json
  NATIVE_ATTACHMENT_RUNTIME_EVIDENCE: attachment-runtime.json
  NATIVE_ARC_RUNTIME_EVIDENCE: arc-runtime.json
  NATIVE_ARC_STATION_RUNTIME_EVIDENCE: station-runtime.json

jobs:
  pytest:
    name: DIAGNOSTIC ONLY native-domain (${{ matrix.history }})
    runs-on: ${{ matrix.os }}
    # The other fifteen runtime combinations retain sixteen balanced shards; unknown costs
    # remain uncertain and a single overlong case can still exceed the job cap.
    # Partial JUnit observations guide scheduling; they do not establish 30-minute fit.
    timeout-minutes: 30
    env:
      ANYGEOMETRY_REQUIRE_QUALIFIED_PLANNING_TESTS: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.14' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ["3.11"]
        shard: [13]
        history: [standalone, original-shard13]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 68098b042e2e5d421dc5d62891b32c47b2e44e80
          persist-credentials: false
      - name: Check out diagnostic tool separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .diagnostic
          persist-credentials: false
      - name: Copy only the external diagnostic pytest plugin
        shell: bash
        run: cp .diagnostic/tools/native_domain_probe.py tools/native_domain_probe.py
      - name: Check out the source-only test consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: audunarn/ANYmesh
          ref: 2ef01d47e29fb461da1cf1ece73913c1708d4e49
          path: .worktrees/ci-mesher-consumer
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Verify the requested Mac architecture
        if: runner.os == 'macOS'
        env:
          MAC_LABEL: ${{ matrix.os }}
        run: >-
          python -c "import os, platform; expected = 'x86_64' if os.environ['MAC_LABEL'] == 'macos-15-intel' else 'arm64'; assert platform.machine() == expected, (platform.machine(), expected)"
      - name: Install test dependencies
        env:
          ANYGEOMETRY_REQUIRE_PLANNING_NATIVE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,planar,sketch,test]" "setuptools>=77.0.3"
      - name: Freeze diagnostic Mac runtime
        run: |
          python -m pip install 'numpy==2.4.6' 'scipy==1.17.1' 'pytest==9.2.0'
          python -c "import platform,sys,numpy,scipy; assert platform.machine()=='arm64'; assert sys.version_info[:3]==(3,11,9); assert numpy.__version__=='2.4.6'; assert scipy.__version__=='1.17.1'"
      - name: Record all original source and test bytes before execution
        shell: bash
        run: |
          mkdir -p diagnostic/${{ matrix.history }}
          git diff --exit-code 68098b042e2e5d421dc5d62891b32c47b2e44e80 -- src tests .github/workflows/ci.yml tools
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,os
          root=pathlib.Path.cwd()
          names=subprocess.check_output(['git','ls-files','-z','--','src','tests','.github/workflows/ci.yml','tools']).decode().split('\0')
          files={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names if name}
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head=='68098b042e2e5d421dc5d62891b32c47b2e44e80'
          path=root/'diagnostic'/'${{ matrix.history }}'/'source-baseline.json'
          path.write_text(json.dumps(dict(source_head=head,workflow_sha=os.environ['GITHUB_SHA'],diagnostic_only=True,files=files),indent=2))
          PY
      - name: Install the qualified planner numerical profile
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
        run: python -m pip install 'numpy==2.4.6' 'scipy==1.17.1'
      - name: Require the frozen positive planner runtime
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
        run: python tools/ci_planning_profile.py --preflight --report planning-profile.json
      - name: Run tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.worktrees/ci-mesher-consumer/src
          CI_MESHER_SOURCE_ROOT: ${{ github.workspace }}/.worktrees/ci-mesher-consumer/src
          ANYGEOMETRY_TEST_SHARD: ${{ matrix.shard }}/16
          ANYGEOMETRY_SHARD_REPORT: shard-${{ matrix.shard }}.json
          NATIVE_DOMAIN_HISTORY: ${{ matrix.history }}
          NATIVE_DOMAIN_PROBE_OUT: diagnostic/${{ matrix.history }}/native-domain-probe.json
          NATIVE_DOMAIN_SOURCE_BASELINE: diagnostic/${{ matrix.history }}/source-baseline.json
        run: |
          python -c "import os,pathlib,json,sys,anygeometry,anymesher; consumer=pathlib.Path(os.environ['CI_MESHER_SOURCE_ROOT']).resolve(); assert pathlib.Path(anymesher.__file__).resolve().is_relative_to(consumer); assert pathlib.Path(anygeometry.__file__).resolve().is_relative_to(pathlib.Path('src').resolve()); pathlib.Path('consumer-runtime.json').write_text(json.dumps(dict(consumer_ref='2ef01d47e29fb461da1cf1ece73913c1708d4e49',consumer_origin=anymesher.__file__,geometry_origin=anygeometry.__file__,mpmath_loaded='mpmath' in sys.modules)),encoding='utf-8')"
          python tools/check_licenses.py --check-installed
          export PYTEST_PLUGINS="${PYTEST_PLUGINS:+${PYTEST_PLUGINS},}tools.native_domain_probe"
          if [ '${{ matrix.history }}' = standalone ]; then
            python tools/native_domain_probe.py --standalone
          else
            python tools/ci_isolated_tests.py --maxfail=1 --durations=20 --junitxml=kernel-results.xml
          fi
      - name: Verify all original bytes after execution
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          path=pathlib.Path('diagnostic/${{ matrix.history }}/source-baseline.json')
          before=json.loads(path.read_text());actual={n:hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in before['files']}
          equal=actual==before['files']
          path.with_name('source-after.json').write_text(json.dumps(dict(diagnostic_only=True,match=equal,files=actual),indent=2))
          assert equal
          PY
      - name: Slowest tests
        if: always()
        shell: bash
        run: python tools/ci_durations.py summary kernel-results.xml >> "$GITHUB_STEP_SUMMARY" || true
      - name: Verify package import and CLI version
        run: |
          python -c "import anygeometry, importlib.metadata, pathlib, tomllib; expected=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert anygeometry.__version__ == importlib.metadata.version('ANYgeometry') == expected"
          python -m anygeometry --version
      - name: Retain effective runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DIAGNOSTIC-native-domain-${{ matrix.history }}
          path: |
            *-runtime.json
            kernel-results.xml
            planning-profile.json
            shard-*.json
            ci-isolation/
            diagnostic/
          if-no-files-found: warn

