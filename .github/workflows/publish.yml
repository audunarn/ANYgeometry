name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate package contract
        id: contract
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          version = project["version"]
          if version != "0.2.4":
              raise SystemExit(f"release workflow requires version 0.2.4, got {version}")
          if "Development Status :: 3 - Alpha" not in project["classifiers"]:
              raise SystemExit("release metadata must retain the Alpha classifier")
          init_text = Path("src/anygeometry/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit("pyproject.toml and anygeometry.__version__ disagree")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY
      - name: Build and check distributions
        env:
          PACKAGE_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          paths = sorted(path for path in Path("dist").iterdir() if path.is_file())
          actual = [path.name for path in paths]
          expected = [
              f"anygeometry-{version}-py3-none-any.whl",
              f"anygeometry-{version}.tar.gz",
          ]
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {actual!r}; expected {expected!r}")

          wheel = Path("dist", expected[0])
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              if "anygeometry/py.typed" not in names:
                  raise SystemExit("wheel is missing anygeometry/py.typed")
              metadata_name, = [name for name in names if name.endswith(".dist-info/METADATA")]
              metadata = email.message_from_bytes(archive.read(metadata_name))
              if metadata["Name"] != "ANYgeometry" or metadata["Version"] != version:
                  raise SystemExit("wheel metadata does not match the package contract")

          sdist = Path("dist", expected[1])
          with tarfile.open(sdist, "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              root = f"anygeometry-{version}"
              if f"{root}/src/anygeometry/py.typed" not in members:
                  raise SystemExit("sdist is missing src/anygeometry/py.typed")
              package_info = archive.extractfile(members[f"{root}/PKG-INFO"])
              if package_info is None:
                  raise SystemExit("sdist is missing readable PKG-INFO")
              metadata = email.message_from_binary_file(package_info)
              if metadata["Name"] != "ANYgeometry" or metadata["Version"] != version:
                  raise SystemExit("sdist metadata does not match the package contract")
          PY
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ANYgeometry-${{ steps.contract.outputs.version }}-release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ANYgeometry
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ANYgeometry-${{ needs.build.outputs.version }}-release-bundle
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
