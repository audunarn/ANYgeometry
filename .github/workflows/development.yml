name: Development feedback (not release acceptance)

# Branches are tested through their pull request; push runs only on main (owner, 2026-11-25: reduce CI load).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled.  A re-run attempt and every other run (main pushes, dispatches) gets a group
# of its own, so it is never cancelled or replaced by a newer run.
concurrency:
  group: development-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run curated unit development profile
        run: python tools/ci_isolated_tests.py --profile unit --evidence-dir development-evidence --junitxml development-results.xml
      - name: Retain partial development receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-unit
          path: |
            development-evidence/
            development-results.xml
          if-no-files-found: warn
  gate:
    name: Development gate
    needs: [unit, manual-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require development unit feedback only
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs['manual-integration'].result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$UNIT_RESULT" = success
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$INTEGRATION_RESULT" = success
          else
            test "$INTEGRATION_RESULT" = skipped
          fi
  manual-integration:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/integration.yml
