[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYgeometry"
version = "0.4.2"
description = "Lightweight deterministic structural-surface geometry kernel"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "dependency-licenses.json",
    "docs/LICENSE.md",
]
authors = [{ name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" }]
classifiers = ["Development Status :: 3 - Alpha"]
dependencies = ["numpy>=1.26"]

[project.scripts]
anygeometry = "anygeometry.__main__:main"

[project.optional-dependencies]
planar = ["shapely>=2.0"]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anygeometry*"]

[tool.setuptools.package-data]
anygeometry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = ["-ra", "-p", "no:cacheprovider"]
